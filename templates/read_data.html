{% extends "layout.html" %}
{% block content %}
<div class="container">
    <h2 class="text-center">Fiche Client</h2>
    {% if data %}
    <ul class="list-group mt-4">
        <li class="list-group-item"><strong>ID :</strong> {{ data[0] }}</li>
        <li class="list-group-item"><strong>Nom :</strong> {{ data[1] }}</li>
        <li class="list-group-item"><strong>Prénom :</strong> {{ data[2] }}</li>
        <li class="list-group-item"><strong>Email :</strong> {{ data[3] }}</li>
        <li class="list-group-item"><strong>Téléphone :</strong> {{ data[4] }}</li>
    </ul>
    {% else %}
    <p class="text-danger mt-4">Aucun client trouvé avec cet ID ou ce nom.</p>
    {% endif %}
</div>
{% endblock content %}
